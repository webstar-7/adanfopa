<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADANFOPA Microfinance</title>
<style>
:root{--ink:#2b3035;--ink-soft:rgba(43,48,53,.1);--accent:#4caf6a;--accent-soft:rgba(76,175,106,.16);--accent-ink:#07210f;
--paper:#f3f4f7;--card:#fff;--line:#e2e6ec;--text:#1b2433;--muted:#667487;
--ok:#1b9a62;--ok-bg:#e2f5ec;--warn:#b76e00;--warn-bg:#fdf0d9;--bad:#d24545;--bad-bg:#fbe5e5;--info:#2f6fda;--info-bg:#e4edfc;
--r:10px;--font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 var(--font);color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(320px,46%) 1fr}
.login-l{background:var(--ink);color:#eef1f8;padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between}
.login-l .mono{width:56px;height:56px;font-size:24px;border-radius:15px}
.login-l h1{font-size:34px;line-height:1.12;margin:26px 0 12px;font-weight:700;letter-spacing:-.4px}
.login-l p.tag{font-size:16px;color:rgba(238,241,248,.75);max-width:34ch}
.login-l ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.login-l li{display:flex;gap:12px;align-items:flex-start;color:rgba(238,241,248,.86);font-size:14.5px}
.login-l li i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px}
.login-r{display:grid;place-items:center;padding:32px}
.login-card{width:100%;max-width:380px}
.login-card h2{font-size:22px;margin-bottom:4px}
.login-card .sub{color:var(--muted);margin-bottom:22px}
.login-card .btn{width:100%;padding:11px;margin-top:6px}
.login-card .demo{margin-top:16px;font-size:13px;color:var(--muted)}
@media(max-width:820px){.login{grid-template-columns:1fr}.login-l{padding:28px}.login-l h1{font-size:26px}.login-l ul{display:none}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.side{background:var(--ink);color:#e9edf7;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 18px}
.mono.logo{background:#fff;padding:0;overflow:hidden;border-radius:50%}.mono.logo img{width:100%;height:100%;display:block;object-fit:cover}
.net.warn .dot{background:#d99a00}.net.off .dot{background:#c0392b}.manualrow{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mono{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.brand b{display:block;font-size:14.5px;line-height:1.2}
.brand small{color:rgba(233,237,247,.62);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;padding-right:2px}
.nav .gap{height:10px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:rgba(233,237,247,.8);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:14.5px}
.nav button svg,.ico{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.side .foot{margin-top:auto;padding:14px 6px 0;border-top:1px solid rgba(255,255,255,.14);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side .foot b{display:block;font-size:13.5px}
.side .foot span{color:rgba(233,237,247,.6)}
.side .foot button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.top .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.net{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 12px;cursor:pointer;font-size:13.5px;font-weight:600}
.net .dot{width:9px;height:9px;border-radius:50%;background:#9aa6b5}
.net.on{border-color:#a9dcc3;background:var(--ok-bg);color:#0f6b43}
.net.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(27,154,98,.18)}
.chip{font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff}
.chip b{color:var(--text)}
.chip i{font-style:normal;color:var(--warn);font-weight:600;margin-left:6px}
.view{padding:24px 28px 70px;max-width:1280px;width:100%}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:column;padding:10px}
 .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.nav .gap{display:none}
 .nav button{white-space:nowrap;padding:8px 10px}.side .foot{display:none}.brand{padding-bottom:8px}
 .top,.view{padding-left:14px;padding-right:14px}
}

/* ---------- basics ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card>h3,.card-h{font-size:15.5px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.num{text-align:right;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:16px}
@media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:#bfc8d4}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .sp{flex:1}
input,select,textarea{border:1px solid #cdd4de;border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.search{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:650;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:#0f6b43}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:#a82c2c}.b-info{background:var(--info-bg);color:#1f52ad}.b-mute{background:#eceff3;color:#4d5a6b}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
td{padding:10px 12px;border-bottom:1px solid #edf0f4;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfd}
td.acts,th.acts{text-align:right;white-space:nowrap}
td.acts .btn{margin-left:4px}
.tc{padding:0;overflow:hidden}
.sub2{display:block;color:var(--muted);font-size:12.5px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:2px}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.strip .s{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13.5px;color:var(--muted)}
.strip .s b{display:block;color:var(--text);font-size:17px;line-height:1.25}
.prog{height:8px;border-radius:99px;background:#e9edf2;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prog.warn i{background:#e0a020}.prog.bad i{background:var(--bad)}.prog.acc i{background:var(--accent)}

/* ---------- forms + modal ---------- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:block}.fld.full{grid-column:1/-1}
.fld>span{display:block;font-size:13px;font-weight:650;color:#455266;margin-bottom:4px}
.fld small{color:var(--muted);font-size:12.5px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.modal-back{position:fixed;inset:0;background:rgba(14,22,38,.5);display:grid;place-items:center;padding:18px;z-index:80;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 24px 70px rgba(10,18,32,.35)}
.modal.wide{max-width:820px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal h3{font-size:17px}
.modal .x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.mbody{padding:20px;max-height:68vh;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
#toast-root{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}

/* ---------- dashboard ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{font-size:24px;letter-spacing:-.3px}
.hello p{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px}
.kpi.bad{border-left-color:var(--bad)}.kpi.warn{border-left-color:#e0a020}.kpi.ok{border-left-color:var(--ok)}.kpi.info{border-left-color:var(--info)}
.kl{display:block;color:var(--muted);font-size:13.5px}
.kv{display:block;font-size:26px;font-weight:750;letter-spacing:-.5px;margin:2px 0}
.ks{display:block;color:var(--muted);font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:12px var(--font);fill:#667487}
.chart .v{font-weight:700;fill:#1b2433}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf0f4}
.list li:last-child{border-bottom:0}
.list b{display:block;font-weight:650}
.list span{color:var(--muted);font-size:13px}
.list em{font-style:normal;font-weight:700;white-space:nowrap}

/* ---------- scan / result ---------- */
.scan{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media(max-width:980px){.scan{grid-template-columns:1fr}}
.scanbox{text-align:center;padding:28px 22px}
.scanbox .big{font-size:20px;font-weight:700;margin:6px 0 4px}
.scanbox input.code{font-size:22px;text-align:center;letter-spacing:2px;padding:14px;margin:14px 0 6px;border-width:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.seg button{border:0;background:#fff;padding:8px 20px;cursor:pointer;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.sres{text-align:left;margin-top:4px}.sres button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-top:6px;border:1px solid var(--line,#d7dce1);border-radius:10px;background:#fff;cursor:pointer;font:inherit;text-align:left}.sres button:hover{border-color:var(--accent)}.sres b{display:block}.sres small{color:var(--muted)}.sres .none{padding:10px 4px;color:var(--muted);font-size:13px}
.tryit{margin-top:16px;text-align:left}
.tryit>span{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.res-back{position:fixed;inset:0;background:rgba(14,22,38,.55);display:grid;place-items:center;z-index:90;padding:18px}
.res-card{background:#fff;border-radius:18px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.res-banner{padding:22px;text-align:center;color:#fff}
.res-banner.ok{background:var(--ok)}.res-banner.bad{background:var(--bad)}.res-banner.warn{background:#d98a11}
.res-banner b{display:block;font-size:26px;letter-spacing:.5px}
.res-body{padding:22px;text-align:center}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--ink);color:#fff;font-size:24px;font-weight:700}
.res-body h4{font-size:20px}
.res-body .rows{margin-top:14px;background:#f5f7fa;border-radius:10px;padding:8px 14px;text-align:left}
.res-body .rows div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;gap:10px}
.res-body .rows div span:first-child{color:var(--muted)}
.res-body .rows div span:last-child{font-weight:650;text-align:right}
@media(prefers-reduced-motion:reduce){.res-card{animation:none}}

/* ---------- till ---------- */
.till{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media(max-width:1000px){.till{grid-template-columns:1fr}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:96px}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:14px;line-height:1.25}
.tile .p{margin-top:auto;font-weight:750;font-size:15.5px}
.tile small{color:var(--muted)}
.tile.out{opacity:.5}
.tile.blocked{background:var(--bad-bg);border-color:#efbcbc}
.cartline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f4}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;font-size:16px}
.qty span{min-width:24px;text-align:center;font-weight:650}
.totalrow{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0}
.rcpt{font:13px/1.4 "Courier New",monospace;width:300px;margin:0 auto;color:#000}
.rcpt h4{text-align:center;font-size:16px;margin:0}
.rcpt .c{text-align:center}
.rcpt hr{border:0;border-top:1px dashed #000;margin:8px 0}
.rcpt .l{display:flex;justify-content:space-between;gap:8px}
.rcpt .b{font-weight:700;font-size:15px}

/* ---------- boards ---------- */
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1100px){.kan{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.kan{grid-template-columns:1fr}}
.col{background:#eef1f5;border-radius:12px;padding:10px;min-height:200px}
.col h4{font-size:14px;display:flex;justify-content:space-between;padding:2px 4px 10px}
.col h4 span{background:#fff;border-radius:99px;padding:0 9px;font-size:13px}
.qc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.qc .n{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;margin-right:8px}
.qc b{font-size:14.5px}
.qc p{font-size:13px;color:var(--muted);margin:4px 0 8px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.room{background:#fff;border:1px solid var(--line);border-top:5px solid var(--ok);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:2px}
.room:hover{box-shadow:0 4px 14px rgba(20,30,50,.1)}
.room .no{font-size:22px;font-weight:800;letter-spacing:-.3px}
.room small{color:var(--muted)}
.room .who{margin-top:auto;font-weight:650;font-size:13.5px}
.room.occupied{border-top-color:var(--bad)}.room.cleaning{border-top-color:#e0a020}.room.maintenance{border-top-color:#8896a8;opacity:.75}
.seatwrap{max-width:330px;margin:0 auto;padding:18px 16px;background:#eef1f5;border-radius:26px 26px 14px 14px}
.cab{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:0 6px 12px}
.srow{display:grid;grid-template-columns:1fr 1fr 22px 1fr 1fr;gap:8px;margin-bottom:8px}
.seat{height:38px;border-radius:8px;border:1px solid #b9c4d2;background:#fff;font-weight:700;cursor:pointer;font-size:13.5px}
.seat:hover{border-color:var(--accent);background:var(--accent-soft)}
.seat.sold{background:#cfd6df;color:#7d8998;cursor:not-allowed;border-color:#cfd6df}
.tripcard{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;width:100%;margin-bottom:8px;display:block}
.tripcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tripcard b{display:block}
.tripcard span{color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #b9c4d2;background:#fff;margin-right:5px;vertical-align:-2px}
.legend i.s{background:#cfd6df;border-color:#cfd6df}
.sms-out .m{max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea{resize:vertical}

</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2b3035"><link rel="apple-touch-icon" href="icon-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="login" class="login" hidden></div>
<div id="app" class="app" hidden>
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
(function(){
'use strict';
const K=window.K={};
let C=null,S=null,user=null,cur='dashboard';

/* ================= helpers ================= */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=(n,l)=>String(n).padStart(l||2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const parse=s=>{const p=String(s).slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return dstr(d);};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/86400000);

async function pushRows(items){

  if(!error)return items;
  if(isNet(error)||isAuthErr(error))throw error;
  if(items.length===1){S.rejected[items[0].k]=error.message;return [items[0]];}
  const mid=items.length>>1;
  return (await pushRows(items.slice(0,mid))).concat(await pushRows(items.slice(mid)));
}
async function flush(){
  const keys=Object.keys(S.outbox);if(!keys.length)return;
  for(let i=0;i<keys.length;i+=100){
    const items=[];
    keys.slice(i,i+100).forEach(k=>{
      const p=k.indexOf('/'),c=k.slice(0,p),id=k.slice(p+1),r=findRow(c,id);
      if(r){items.push({k:k,row:{collection:c,id:id,data:r.data,deleted:false},h:H(r.data)});}
      else{items.push({k:k,row:{collection:c,id:id,data:{},deleted:true},h:DEL});}
    });
    const done=await pushRows(items);
    done.forEach(x=>{
      S.base[x.k]=x.h;
      const p=x.k.indexOf('/'),r=findRow(x.k.slice(0,p),x.k.slice(p+1));
      const nowH=r?H(r.data):DEL;

}
async function pull(){
  let changed=false,maxAt=S.cursor,guard=0;
  const since=S.cursor?new Date(Date.parse(S.cursor)-10000).toISOString():null;
  let from=0;
  while(guard++<200){
    let q=sb.from('adf_records').select('collection,id,data,deleted,updated_at').order('updated_at',{ascending:true}).order('id',{ascending:true}).range(from,from+999);
    if(since)q=q.gt('updated_at',since);
    const {data,error}=await q;
    if(error)throw error;
    (data||[]).forEach(x=>{
      if(!maxAt||x.updated_at>maxAt)maxAt=x.updated_at;
      const k=x.collection+'/'+x.id;
      if(S.outbox[k])return;
      if(x.collection==='meta'){
        const tgt=x.id==='settings'?S.settings:x.id==='sms'?S.sms:null;if(!tgt||x.deleted)return;
        const before=canon(tgt);Object.assign(tgt,x.data);
        if(canon(tgt)!==before)changed=true;
        S.base[k]=H(tgt);return;
      }
      if(COLLS.indexOf(x.collection)<0)return;
      const arr=S.t[x.collection];const i=arr.findIndex(r=>r.id===x.id);
      if(x.deleted){if(i>=0){arr.splice(i,1);changed=true;}S.base[k]=DEL;return;}
      const row=x.data;row.id=x.id;
      const nh=H(row);
      if(i<0){arr.push(row);changed=true;}
      else if(H(arr[i])!==nh){const old=arr[i];Object.keys(old).forEach(f=>{delete old[f];});Object.assign(old,row);changed=true;}  // update in place so open screens keep valid references
      S.base[k]=nh;
    });
    if(!data||data.length<1000)break;
    from+=1000;
  }
  if(maxAt)S.cursor=maxAt;
  return changed;
}

  const VER={1:[10,[[1,16]]],2:[16,[[1,28]]],3:[26,[[1,44]]],4:[18,[[2,32]]],5:[24,[[2,43]]],6:[16,[[4,27]]],7:[18,[[4,31]]],8:[22,[[2,38],[2,39]]],9:[22,[[3,36],[2,37]]],10:[26,[[4,43],[1,44]]]};

    const bytes=utf8(text);let v=1;

    const penalty=g=>{
      let p=0;
      for(let t=0;t<2;t++){for(let a=0;a<size;a++){let run=1;for(let b=1;b<size;b++){const cur=t?g[b][a]:g[a][b],prev=t?g[b-1][a]:g[a][b-1];
        if(cur===prev){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=g[y][x];if(c===g[y][x+1]&&c===g[y+1][x]&&c===g[y+1][x+1])p+=3;}
      const pat=[true,false,true,true,true,false,true,false,false,false,false],rev=pat.slice().reverse();
      for(let t=0;t<2;t++)for(let a=0;a<size;a++)for(let b=0;b<=size-11;b++){
        let m1=true,m2=true;for(let i=0;i<11;i++){const c=t?g[b+i][a]:g[a][b+i];if(c!==pat[i])m1=false;if(c!==rev[i])m2=false;if(!m1&&!m2)break;}
        if(m1||m2)p+=40;}
      let dark=0;for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(g[y][x])dark++;
      p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;
      return p;};
    let best=-1,bestP=1e9,bestG=null;
    for(let m=0;m<8;m++){
      const g=M.map(r=>r.slice());
      for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MASK[m](x,y))g[y][x]=!g[y][x];
      // format info for this mask
      const save=M,sv=F;const b=fmt(m),gb=i=>((b>>>i)&1)===1;
      const sf=(x,y,d)=>{g[y][x]=d;};
      for(let i=0;i<=5;i++)sf(8,i,gb(i));sf(8,7,gb(6));sf(8,8,gb(7));sf(7,8,gb(8));for(let i=9;i<15;i++)sf(14-i,8,gb(i));
      for(let i=0;i<8;i++)sf(size-1-i,8,gb(i));for(let i=8;i<15;i++)sf(8,size-15+i,gb(i));sf(8,size-8,true);
      const pn=penalty(g);if(pn<bestP){bestP=pn;best=m;bestG=g;}
    }
    return{size:size,modules:bestG,version:v,mask:best};
  }
  // SVG with a 4-module quiet zone
  function svg(text,px){
    const q=make(text),n=q.size,pad=4;let d='';
    for(let y=0;y<n;y++){let x=0;while(x<n){if(q.modules[y][x]){let e=x;while(e<n&&q.modules[y][e])e++;d+='M'+(x+pad)+' '+(y+pad)+'h'+(e-x)+'v1h-'+(e-x)+'z';x=e;}else x++;}}
    const t=n+pad*2;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" width="'+(px||t)+'" height="'+(px||t)+'" shape-rendering="crispEdges"><rect width="'+t+'" height="'+t+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
  }
  return{make:make,svg:svg};
})();

K.badge=(t,tone)=>'<span class="badge b-'+(tone||'mute')+'">'+esc(t)+'</span>';
K.empty=(t,s)=>'<div class="empty"><b>'+esc(t)+'</b>'+(s?esc(s):'')+'</div>';
K.prog=(pct,tone)=>'<div class="prog '+(tone||'')+'"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div>';
K.chips=(list,curIdx,act)=>'<div class="chips">'+list.map((l,i)=>'<button type="button" class="'+(i===curIdx?'on':'')+'" data-act="'+act+'" data-id="'+i+'">'+esc(l)+'</button>').join('')+'</div>';
K.strip=items=>'<div class="strip">'+items.map(i=>'<div class="s">'+esc(i[0])+'<b>'+esc(i[1])+'</b></div>').join('')+'</div>';
K.table=(cols,rows,opt)=>{
  opt=opt||{};
  if(!rows.length)return K.empty(opt.empty||'Nothing here yet',opt.emptySub||'');
  return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th class="'+(c.cls||'')+'">'+esc(c.l)+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map((r,i)=>'<tr>'+cols.map(c=>'<td class="'+(c.cls||'')+'">'+(c.f?c.f(r,i):esc(r[c.k]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
};
K.bind=(el,h)=>{
  el.onclick=e=>{const b=e.target.closest('[data-act]');if(!b||!el.contains(b))return;const f=h[b.dataset.act];if(f)f(b.dataset.id,b,e);};
  el.onchange=e=>{const t=e.target.closest('[data-chg]');if(t&&el.contains(t)){const f=h[t.dataset.chg];if(f)f(t.value,t,e);}};
  el.oninput=e=>{const t=e.target.closest('[data-inp]');if(t&&el.contains(t)){const f=h[t.dataset.inp];if(f)f(t.value,t,e);}};
};
K.render=()=>go(cur);
K.go=go;K.tabOk=tabOk;
K.go=id=>go(id);

K.toast=(msg,tone)=>{
  const root=document.getElementById('toast-root');
  const t=document.createElement('div');t.className='toast '+(tone||'');t.textContent=msg;root.appendChild(t);
  setTimeout(()=>t.remove(),2800);
};
K.modal=o=>{
  const root=document.getElementById('modal-root');
  const w=document.createElement('div');w.className='modal-back';
  w.innerHTML='<div class="modal'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true"><header><h3>'+esc(o.title)+'</h3><button class="x" data-close aria-label="Close">\u00D7</button></header><div class="mbody">'+o.body+'</div><footer>'+(o.buttons||[]).map((b,i)=>'<button type="button" class="btn '+(b.cls||'')+'" data-b="'+i+'">'+esc(b.l)+'</button>').join('')+'</footer></div>';
  const close=()=>{w.remove();document.removeEventListener('keydown',key);};
  const key=e=>{if(e.key==='Escape'&&root.lastElementChild===w)close();};
  document.addEventListener('keydown',key);
  w.addEventListener('mousedown',e=>{if(e.target===w)close();});
  w.addEventListener('click',e=>{
    if(e.target.closest('[data-close]')){close();return;}
    const b=e.target.closest('[data-b]');
    if(b){const def=o.buttons[+b.dataset.b];const r=def.fn?def.fn(w,close):undefined;if(r!==false)close();}
  });
  root.appendChild(w);
  const f=w.querySelector('input:not([type=hidden]),select,textarea');if(f&&!o.noFocus)f.focus();
  if(o.onOpen)o.onOpen(w,close);
  return{close,el:w};
};
K.confirm=(msg,yes,fn,tone)=>K.modal({title:'Please confirm',body:'<p>'+esc(msg)+'</p>',buttons:[{l:'Cancel'},{l:yes||'Yes',cls:tone||'pri',fn:()=>{fn();}}]});

K.formModal=o=>{
  const v=o.values||{};
  const fld=f=>{
    const val=v[f.k]!=null?v[f.k]:(f.def!=null?f.def:'');
    let inp;
    const optsOf=()=>((typeof f.opts==='function'?f.opts():f.opts)||[]).map(x=>typeof x==='object'?x:{v:x,l:x});
    if(f.t==='select'){
      inp='<select name="'+f.k+'">'+(f.blank===false?'':'<option value="">\u2014 choose \u2014</option>')+optsOf().map(x=>'<option value="'+esc(x.v)+'"'+(String(x.v)===String(val)?' selected':'')+'>'+esc(x.l)+'</option>').join('')+'</select>';
    }else if(f.t==='pick'){
      const os=optsOf();const cur2=os.find(x=>String(x.v)===String(val));
      inp='<input name="'+f.k+'" list="dl_'+f.k+'" autocomplete="off" value="'+esc(cur2?cur2.l:'')+'" placeholder="'+esc(f.ph||'Start typing a name\u2026')+'"><datalist id="dl_'+f.k+'">'+os.map(x=>'<option value="'+esc(x.l)+'"></option>').join('')+'</datalist>';
    }else if(f.t==='textarea'){
      inp='<textarea name="'+f.k+'" rows="3">'+esc(val)+'</textarea>';
    }else{
      inp='<input name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(val)+'"'+(f.step?' step="'+f.step+'"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+(f.ro?' readonly':'')+'>';
    }
    return '<label class="fld'+(f.w==='full'||f.t==='textarea'?' full':'')+'"><span>'+esc(f.l)+(f.req?' *':'')+'</span>'+inp+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</label>';
  };
  return K.modal({title:o.title,wide:o.wide,body:'<form class="fgrid" onsubmit="return false">'+o.fields.map(fld).join('')+'</form>'+(o.foot||''),
    buttons:[{l:'Cancel'},{l:o.saveLabel||'Save',cls:'pri',fn:w=>{
      const out={};
      for(const f of o.fields){
        const el=w.querySelector('[name="'+f.k+'"]');let x=el?el.value.trim():'';
        if(f.t==='pick'){
          const os=((typeof f.opts==='function'?f.opts():f.opts)||[]).map(y=>typeof y==='object'?y:{v:y,l:y});
          if(x){const m=os.find(y=>y.l===x);if(!m){K.toast('Choose "'+f.l+'" from the list','bad');el.focus();return false;}x=m.v;}
        }
        if(f.req&&x===''){K.toast('Fill in: '+f.l,'bad');if(el)el.focus();return false;}
        if(f.t==='number'&&x!=='')x=Number(x);
        out[f.k]=x;
      }
      return o.onSave(out,w);
    }}]});
};

K.result=o=>{
  const root=document.getElementById('modal-root');
  const w=document.createElement('div');w.className='res-back';
  w.innerHTML='<div class="res-card"><div class="res-banner '+(o.tone||'ok')+'"><b>'+esc(o.title)+'</b></div><div class="res-body"><div class="avatar" style="background:'+(o.tone==='bad'?'#a82c2c':o.tone==='warn'?'#a86a08':'#0f6b43')+'">'+esc(initials(o.name))+'</div><h4>'+esc(o.name)+'</h4><div class="muted">'+esc(o.sub||'')+'</div><div class="rows">'+(o.rows||[]).map(r=>'<div><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>').join('')+'</div></div></div>';
  const close=()=>{clearTimeout(t);w.remove();};
  const t=setTimeout(close,o.ms||4200);
  w.onclick=close;root.appendChild(w);
};

const RCPT_CSS='.rcpt{font:13px/1.4 "Courier New",monospace;width:300px;margin:0 auto;color:#000}.rcpt h4{text-align:center;font-size:16px;margin:0}.rcpt .c{text-align:center}.rcpt hr{border:0;border-top:1px dashed #000;margin:8px 0}.rcpt .l{display:flex;justify-content:space-between;gap:8px}.rcpt .b{font-weight:700;font-size:15px}';
K.print=html=>{
  let f=document.getElementById('printframe');if(f)f.remove();
  f=document.createElement('iframe');f.id='printframe';f.setAttribute('aria-hidden','true');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  try{const d=f.contentWindow.document;d.open();d.write(html);d.close();}catch(e){return;}
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print();}catch(e){}},250);
};
K.receiptBody=o=>{
  const st=S.settings;
  return '<div class="rcpt"><h4>'+esc(st.org)+'</h4><div class="c" style="font-size:11px">'+esc(C.address||'')+'</div><div class="c">'+esc(st.phone||'')+'</div><hr>'+
   '<div class="c b">'+esc(o.title)+'</div>'+
   (o.meta||[]).map(m=>'<div class="l"><span>'+esc(m[0])+'</span><span>'+esc(m[1])+'</span></div>').join('')+'<hr>'+
   (o.items||[]).map(i=>'<div>'+esc(i.n)+'</div><div class="l"><span>&nbsp;&nbsp;'+esc(i.q)+' x '+esc(i.p)+'</span><span>'+esc(i.t)+'</span></div>').join('')+
   ((o.items||[]).length?'<hr>':'')+
   (o.totals||[]).map(t=>'<div class="l'+(t[2]?' b':'')+'"><span>'+esc(t[0])+'</span><span>'+esc(t[1])+'</span></div>').join('')+
   '<hr><div class="c">'+esc(o.foot||'Thank you')+'</div><div class="c" style="font-size:11px;margin-top:6px">ADANFOPA — Empowering communities through financial inclusion</div></div>';
};
K.printReceipt=o=>K.print('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Receipt</title><style>@page{margin:6mm}body{margin:0}'+RCPT_CSS+'</style></head><body>'+K.receiptBody(o)+'</body></html>');
K.showReceipt=(o,after)=>K.modal({title:'Receipt',body:K.receiptBody(o),buttons:[{l:'Close',fn:()=>{if(after)after();}},{l:'Print receipt',cls:'pri',fn:()=>{K.printReceipt(o);return false;}}]});
K.printDoc=(title,body)=>K.print('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>@page{size:A4;margin:14mm}body{font:13px/1.45 "Segoe UI",Arial,sans-serif;color:#111}h1{font-size:20px;margin:0}h2{font-size:15px;margin:18px 0 6px}.sub{color:#555;margin:2px 0 14px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#f0f0f0}td.n,th.n{text-align:right}.tot{font-weight:700}.foot{margin-top:24px;color:#777;font-size:11px}</style></head><body><h1>'+esc(S.settings.org)+'</h1><div class="sub">'+esc(C.address||'')+' &middot; Tel: '+esc(S.settings.phone||'')+'</div><h2>'+esc(title)+'</h2><div class="sub">'+esc('')+' &middot; printed '+fmtDate(today())+'</div>'+body+'<div class="foot">ADANFOPA — Empowering communities through financial inclusion</div></body></html>');

/* ================= generic CRUD view ================= */
K.crud=(el,d)=>{
  const st={q:'',chip:0,rng:d.range?(d.range.def||'all'):'all'};
  const RNG=[['today','Today'],['week','Last 7 days'],['month','Last 30 days'],['all','All']];
  const inRange=r=>{
    if(!d.range||st.rng==='all')return true;
    const v=String(r[d.range.key]||'').slice(0,10),t=today();
    if(st.rng==='today')return v===t;if(st.rng==='week')return v>=addDays(t,-6)&&v<=t;if(st.rng==='month')return v>=addDays(t,-29)&&v<=t;return true;
  };
  const list=()=>{
    let r=K.T(d.table).filter(inRange);
    if(d.chips&&d.chips[st.chip]&&d.chips[st.chip].fn)r=r.filter(d.chips[st.chip].fn);
    if(st.q){const q=st.q.toLowerCase();r=r.filter(x=>(d.search||[]).some(k=>String(typeof k==='function'?k(x):(x[k]==null?'':x[k])).toLowerCase().indexOf(q)>-1));}
    if(d.sort)r=r.slice().sort(d.sort);
    return r;
  };
  const cols=d.cols.slice();
  const hasActs=!d.noEdit||!d.noDelete||(d.actions&&d.actions.length);
  const tbl=r=>{
    const c=cols.concat(hasActs?[{l:'',cls:'acts',f:row=>
      (d.actions||[]).filter(a=>!a.show||a.show(row)).map(a=>'<button class="btn sm '+(a.cls||'')+'" data-act="row" data-a="'+a.a+'" data-id="'+row.id+'">'+esc(a.l)+'</button>').join('')+
      (d.noEdit?'':'<button class="btn sm" data-act="edit" data-id="'+row.id+'">Edit</button>')+
      (d.noDelete?'':'<button class="btn sm bad" data-act="del" data-id="'+row.id+'">Delete</button>')}]:[]);
    return K.table(c,r,{empty:d.empty||'Nothing here yet',emptySub:d.emptySub||(d.noAdd?'':'Use the add button to create the first one.')});
  };
  const paintBody=()=>{const r=list();const b=el.querySelector('#cbody'),s=el.querySelector('#csum');if(b)b.innerHTML=tbl(r);if(s)s.innerHTML=d.summary?d.summary(r):'';};
  const paint=()=>{
    el.innerHTML='<div class="bar">'+(d.search?'<input class="search" data-inp="q" placeholder="'+esc(d.searchPh||'Search\u2026')+'" value="'+esc(st.q)+'">':'')+
      (d.chips?K.chips(d.chips.map(c=>c.l),st.chip,'chip'):'')+
      (d.range?K.chips(RNG.map(x=>x[1]),RNG.findIndex(x=>x[0]===st.rng),'rng'):'')+
      '<span class="sp"></span>'+(d.topHtml||'')+(d.noAdd?'':'<button class="btn pri" data-act="add">+ '+esc(d.addLabel||'Add')+'</button>')+'</div><div id="csum"></div><div class="card tc" id="cbody"></div>';
    paintBody();
  };
  const form=(row)=>K.formModal({title:(row?'Edit ':'Add ')+(d.noun||'record'),fields:typeof d.fields==='function'?d.fields(row):d.fields,values:row||(d.defaults?d.defaults():{}),wide:d.wide,
    onSave:v=>{
      if(d.validate){const m=d.validate(v,row);if(m){K.toast(m,'bad');return false;}}
      if(row){const out=d.before?d.before(v,row):v;K.upd(d.table,row.id,out);if(d.after)d.after(K.get(d.table,row.id),false);}
      else{const out=d.before?d.before(v,null):v;const nr=K.add(d.table,out);if(d.after)d.after(nr,true);K.log('Added '+(d.noun||'record')+(nr.name?': '+nr.name:''));}
      K.toast('Saved','ok');paint();
    }});
  const ext={};Object.keys(d.on||{}).forEach(k=>{ext[k]=(id,b)=>d.on[k](id,b,paint);});
  K.bind(el,Object.assign({
    q:v=>{st.q=v;paintBody();},
    chip:i=>{st.chip=+i;paint();},
    rng:i=>{st.rng=RNG[+i][0];paint();},
    add:()=>form(null),
    edit:id=>form(K.get(d.table,id)),
    del:id=>{const row=K.get(d.table,id);K.confirm('Delete this '+(d.noun||'record')+(row&&row.name?' ('+row.name+')':'')+'? This cannot be undone.','Delete',()=>{K.del(d.table,id);if(d.afterDelete)d.afterDelete(row);K.toast('Deleted');paint();},'bad');},
    row:(id,b)=>{const a=d.actions.find(x=>x.a===b.dataset.a);if(a)a.fn(K.get(d.table,id),paint);}
  },ext));
  paint();
  return{paint};
};

/* ================= generic till (POS + pharmacy) ================= */
K.till=(el,d)=>{
  const st={cart:[],q:'',cat:0,method:d.methods[0],tender:''};
  const items=()=>K.T(d.items);
  const cats=()=>['All'].concat(Array.from(new Set(items().map(d.catOf))).sort());
  const inCart=id=>{const l=st.cart.find(x=>x.id===id);return l?l.qty:0;};
  const total=()=>sum(st.cart,l=>l.qty*l.price);
  el.innerHTML='<div class="till"><section><div class="bar"><input class="search" id="tq" data-inp="q" placeholder="Search '+esc(d.noun)+'\u2026"><div id="tcats"></div></div><div class="tgrid" id="tgrid"></div></section><aside class="card" id="tcart"></aside></div>';
  const drawCats=()=>{el.querySelector('#tcats').innerHTML=K.chips(cats(),st.cat,'cat');};
  const drawGrid=()=>{
    const cl=cats()[st.cat]||'All';const q=st.q.toLowerCase();
    const list=items().filter(it=>(cl==='All'||d.catOf(it)===cl)&&(!q||(it.name+' '+(it.sku||'')).toLowerCase().indexOf(q)>-1));
    el.querySelector('#tgrid').innerHTML=list.length?list.map(it=>{
      const info=d.info(it);const blk=d.block?d.block(it):null;
      return '<button type="button" class="tile'+(it.stock<=0?' out':'')+(blk?' blocked':'')+'" data-act="add" data-id="'+it.id+'"><b>'+esc(it.name)+'</b><small>'+esc(info.sub||'')+'</small><span class="p">'+money(it.price)+'</span><small>'+(blk?esc(blk):(it.stock<=0?'Out of stock':it.stock+' in stock'))+'</small></button>';
    }).join(''):K.empty('No match','Try another name.');
  };
  const drawCart=()=>{
    const t=total();const tender=st.tender===''?t:Number(st.tender);const change=Math.max(0,tender-t);
    el.querySelector('#tcart').innerHTML='<h3 class="card-h">Current '+esc(d.saleNoun)+'</h3>'+
      (st.cart.length?st.cart.map(l=>'<div class="cartline"><div><b>'+esc(l.name)+'</b><span class="sub2">'+money(l.price)+' each</span></div><div class="qty"><button data-act="dec" data-id="'+l.id+'" aria-label="Less">\u2212</button><span>'+l.qty+'</span><button data-act="inc" data-id="'+l.id+'" aria-label="More">+</button></div><b>'+money(l.qty*l.price)+'</b></div>').join(''):K.empty('Cart is empty','Tap an item to add it.'))+
      '<div class="totalrow"><span>Total</span><span>'+money(t)+'</span></div>'+
      (d.fields||[]).map(f=>'<label class="fld" style="margin-bottom:8px"><span>'+esc(f.l)+(f.req?' *':'')+'</span>'+(f.t==='select'?'<select id="tf_'+f.k+'">'+(typeof f.opts==='function'?f.opts():f.opts).map(o=>{o=typeof o==='object'?o:{v:o,l:o};return '<option value="'+esc(o.v)+'">'+esc(o.l)+'</option>';}).join('')+'</select>':'<input id="tf_'+f.k+'" type="'+(f.t||'text')+'" placeholder="'+esc(f.ph||'')+'">')+'</label>').join('')+
      '<label class="fld" style="margin-bottom:8px"><span>Payment</span><select data-chg="method">'+d.methods.map(m=>'<option'+(m===st.method?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select></label>'+
      (st.method==='Cash'?'<label class="fld" style="margin-bottom:8px"><span>Cash received</span><input type="number" step="0.01" id="tender" data-inp="tender" value="'+(st.tender===''?'':esc(st.tender))+'" placeholder="'+t.toFixed(2)+'"></label><div class="small muted" style="margin-bottom:8px">Change: <b>'+money(change)+'</b></div>':'')+
      '<button class="btn acc lg" style="width:100%" data-act="pay"'+(st.cart.length?'':' disabled')+'>Complete '+esc(d.saleNoun)+'</button>'+
      (st.cart.length?'<button class="btn sm" style="width:100%;margin-top:8px" data-act="clear">Clear cart</button>':'');
  };
  const addItem=id=>{
    const it=K.get(d.items,id);if(!it)return;
    const blk=d.block?d.block(it):null;if(blk){K.toast(blk,'bad');return;}
    if(inCart(id)+1>it.stock){K.toast('Only '+it.stock+' left in stock','bad');return;}
    const l=st.cart.find(x=>x.id===id);if(l)l.qty++;else st.cart.push({id,name:it.name,price:it.price,qty:1});
    drawCart();
  };
  const complete=()=>{
    if(!st.cart.length)return;
    const vals={};
    for(const f of (d.fields||[])){const e2=el.querySelector('#tf_'+f.k);vals[f.k]=e2?e2.value.trim():'';if(f.req&&!vals[f.k]){K.toast('Fill in: '+f.l,'bad');return;}}
    if(d.validate){const m=d.validate(st.cart,vals,st.method);if(m){K.toast(m,'bad');return;}}
    const t=total();const tender=st.method==='Cash'?(st.tender===''?t:Number(st.tender)):t;
    if(st.method==='Cash'&&tender<t){K.toast('Cash received is less than the total','bad');return;}
    const n=K.T(d.sales).length+1;
    const sale=Object.assign({ref:d.prefix+pad(n,4),date:today(),time:nowTime(),items:st.cart.map(l=>({id:l.id,name:l.name,qty:l.qty,price:l.price})),total:t,method:st.method,tendered:tender,change:Math.max(0,tender-t),cashier:user?user.name:''},vals);
    K.add(d.sales,sale);
    st.cart.forEach(l=>{const it=K.get(d.items,l.id);if(it)it.stock=Math.max(0,it.stock-l.qty);});
    save();
    if(d.onSale)d.onSale(sale);
    K.log(d.saleNoun[0].toUpperCase()+d.saleNoun.slice(1)+' '+sale.ref+' \u2014 '+money(t));
    st.cart=[];st.tender='';drawGrid();drawCart();
    K.showReceipt(d.receipt(sale));
  };
  K.bind(el,{
    q:v=>{st.q=v;drawGrid();},cat:i=>{st.cat=+i;drawCats();drawGrid();},
    add:id=>addItem(id),
    inc:id=>addItem(id),
    dec:id=>{const l=st.cart.find(x=>x.id===id);if(!l)return;l.qty--;if(l.qty<=0)st.cart=st.cart.filter(x=>x.id!==id);drawCart();},
    clear:()=>{st.cart=[];drawCart();},
    method:v=>{st.method=v;drawCart();},
    tender:v=>{st.tender=v;const t=total();const c=Math.max(0,(v===''?t:Number(v))-t);const s=el.querySelector('#tcart .small b');if(s)s.textContent=money(c);},
    pay:complete
  });
  drawCats();drawGrid();drawCart();
};

/* ================= dashboard ================= */
K.barChart=(data,unit)=>{
  const W=440,H=190,pl=8,pb=26,pt=22,n=data.length,bw=(W-pl*2)/n;
  const max=Math.max(1,...data.map(x=>x.v));
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img">'+data.map((x,i)=>{
    const h=Math.max(2,(x.v/max)*(H-pb-pt)),x0=pl+i*bw+bw*.18,w=bw*.64,y=H-pb-h;
    return '<rect x="'+x0.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" fill="var(--accent)"/>'+
      '<text class="v" x="'+(x0+w/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+esc(unit==='money'?Math.round(x.v).toLocaleString('en-US'):x.v)+'</text>'+
      '<text x="'+(x0+w/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(x.l)+'</text>';
  }).join('')+'</svg></div>';
};
K.lastDays=(n,fn)=>{const out=[];for(let i=n-1;i>=0;i--){const d=addDays(today(),-i);out.push({l:DOW[parse(d).getDay()],d,v:fn(d)});}return out;};

function renderSms(el){
  const st={to:'',msg:''};
  const groups=C.smsGroups?C.smsGroups(K):[];
  const draw=()=>{
    const q=K.T('sms');
    el.innerHTML='<div class="grid2"><div class="card"><h3>Send a message</h3>'+
     '<label class="fld" style="margin-bottom:10px"><span>Send to</span><select id="sg"><option value="">One number\u2026</option>'+groups.map((g,i)=>'<option value="'+i+'">'+esc(g.l)+' ('+g.people().length+')</option>').join('')+'</select></label>'+
     '<label class="fld" id="onew" style="margin-bottom:10px"><span>Phone number</span><input id="sn" type="tel" placeholder="0240000000"></label>'+
     ((C.smsTemplates||[]).length?'<div class="chips" style="margin-bottom:10px">'+C.smsTemplates.map((t,i)=>'<button type="button" data-act="tpl" data-id="'+i+'">'+esc(t.l)+'</button>').join('')+'</div>':'')+
     '<label class="fld"><span>Message</span><textarea id="sm" rows="5" data-inp="count" placeholder="Type your message. {name} is replaced with each person\u2019s name."></textarea></label>'+
     '<div class="small muted" id="scount" style="margin:6px 0 12px">0 characters \u00B7 1 credit each</div>'+
     '<button class="btn acc" data-act="send">Queue message</button> <span class="small muted">Sent as <b>'+esc(S.settings.sender)+'</b> from your own Hubtel account</span></div>'+
     '<div class="card sms-out"><div class="card-h"><span>Outbox</span><button class="btn sm" data-act="clr">Clear sent</button></div>'+
     (q.length?K.table([{l:'To',f:m=>esc(m.name||m.to)+'<span class="sub2">'+esc(m.to)+'</span>'},{l:'Message',f:m=>'<div class="m" title="'+esc(m.msg)+'">'+esc(m.msg)+'</div>'},{l:'Status',f:m=>m.status==='sent'?K.badge('Sent','ok'):m.status==='queued'?K.badge('Waiting — SMS not connected yet','warn'):K.badge('Failed','bad')}],q.slice(0,40)):K.empty('No messages yet','Messages you queue will show up here.'))+
     (q.some(m=>m.status==='queued')?'<p class="small muted" style="margin-top:12px">Messages stay in this list until the Hubtel SMS connection is switched on. Nothing has been sent to customers yet.</p>':'')+
     '</div></div>';
    const sg=el.querySelector('#sg');sg.onchange=()=>{el.querySelector('#onew').style.display=sg.value===''?'block':'none';};
  };
  draw();
  const keep=()=>{st.msg=el.querySelector('#sm').value;st.to=el.querySelector('#sg').value;};
  K.bind(el,{
    count:v=>{el.querySelector('#scount').textContent=v.length+' characters \u00B7 '+segs(v)+' credit'+(segs(v)>1?'s':'')+' each';},
    tpl:i=>{el.querySelector('#sm').value=C.smsTemplates[+i].text;el.querySelector('#sm').dispatchEvent(new Event('input',{bubbles:true}));},
    clr:()=>{S.t.sms=K.T('sms').filter(m=>m.status!=='sent');save();draw();},
    send:()=>{
      const msg=el.querySelector('#sm').value.trim();const gi=el.querySelector('#sg').value;
      if(!msg){K.toast('Type a message first','bad');return;}
      let people;
      if(gi==='')people=[{name:'',phone:el.querySelector('#sn').value.trim()}];else people=groups[+gi].people();
      people=people.filter(p=>p.phone);
      if(!people.length){K.toast('No phone numbers to send to','bad');return;}
      people.forEach(p=>K.sms(p.phone,msg.replace(/\{name\}/g,firstName(p.name)||'there'),'Broadcast',p.name));
      K.log('Queued '+people.length+' SMS');K.toast(people.length+' message'+(people.length>1?'s':'')+' queued','ok');
      draw();
    }
  });
}

/* ================= settings ================= */
async function staffCall(action,body){
  if(!navigator.onLine)return{error:'You need an internet connection to change staff.'};
  try{
    const {data,error}=await sb.functions.invoke('adf-manage-staff',{body:Object.assign({action:action},body||{})});
    if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error;}catch(e){}return{error:m};}
    if(data&&data.error)return{error:data.error};
    return{data:data};
  }catch(e){return{error:String((e&&e.message)||e)};}
}
function userForm(id){
  const u=id?K.staff().find(x=>x.id===id):null;
  const fields=[{k:'full_name',l:'Full name',req:1,w:'full'}];
  if(!u)fields.push({k:'username',l:'Username (for signing in)',req:1,hint:'Letters, numbers, dot, dash. Example: ama.boateng'});
  fields.push({k:'role',l:'Role',t:'select',opts:Object.keys(C.roles),blank:false,req:1});
  if(u)fields.push({k:'active',l:'Access',t:'select',opts:[{v:'yes',l:'Active'},{v:'no',l:'Disabled'}],blank:false});
  fields.push({k:'password',l:u?'New password':'Temporary password',req:!u,t:'text',hint:u?'Leave empty to keep the current password. The person must choose a new one at next sign-in.':'At least 8 characters. The person will be asked to choose their own at first sign-in.'});
  K.formModal({title:u?'Edit staff':'Add staff',saveLabel:u?'Save changes':'Create login',
   values:u?{full_name:u.full_name,role:u.role,active:u.active?'yes':'no'}:{role:'Susu collector'},fields:fields,
   onSave:(v,w)=>{
    if(v.password&&v.password.length<8){K.toast('Password must be at least 8 characters','bad');return false;}
    if(!u&&!/^[a-z0-9._-]{3,30}$/.test(String(v.username).toLowerCase())){K.toast('Username must be 3–30 letters, numbers, dot, dash or underscore','bad');return false;}
    const btn=w.querySelector('footer .pri');btn.disabled=true;
    (async()=>{
      let r;
      if(!u){r=await staffCall('create',{username:String(v.username).toLowerCase(),full_name:v.full_name,role:v.role,password:v.password});}
      else{
        r=await staffCall('update',{id:u.id,full_name:v.full_name,role:v.role,active:v.active!=='no'});
        if(!r.error&&v.password)r=await staffCall('reset_password',{id:u.id,password:v.password});
      }
      btn.disabled=false;
      if(r.error){K.toast(r.error,'bad');return;}
      K.log((u?'Staff updated — ':'Staff added — ')+v.full_name+' ('+v.role+')');
      try{await refreshStaff();}catch(e){}
      K.toast('Saved','ok');
      w.querySelector('[data-close]').click();K.render();
    })();
    return false;
   }});
}

function navItems(){
  const all=[{id:'dashboard',label:'Overview',icon:'home'}].concat(C.nav,[{gap:1},{id:'sms',label:'Messages',icon:'msg'},{id:'settings',label:'Settings',icon:'gear'}]);
  const ok=all.filter(n=>n.gap||tabOk(n.id));
  return ok.filter((n,i)=>!n.gap||(i>0&&i<ok.length-1&&!ok[i-1].gap));
}
function firstTab(){const n=navItems().find(x=>!x.gap);return n?n.id:null;}
function titleOf(id){const n=navItems().find(x=>x.id===id);return n?n.label:'';}
function chromeSide(){
  const s=document.getElementById('side');
  s.innerHTML='<div class="brand"><div class="mono logo"><img src="'+LOGO_URI+'" alt="ADANFOPA logo"></div><div><b>'+esc(S.settings.org)+'</b><small>'+esc(C.product)+'</small></div></div><nav class="nav" aria-label="Main">'+
   navItems().map(n=>n.gap?'<div class="gap"></div>':'<button type="button" data-nav="'+n.id+'" class="'+(n.id===cur?'on':'')+'">'+K.icon(n.icon)+'<span>'+esc(n.label)+'</span></button>').join('')+'</nav>'+

function confirmLogout(){
  const n=pending();
  if(n&&!navigator.onLine){K.confirm('You are offline and '+n+' entr'+(n===1?'y has':'ies have')+' not uploaded yet. If you sign out you will need internet to sign in again. Sign out anyway?','Sign out',()=>{doLogout();},'bad');return;}
  doLogout();
}
function syncChip(){
  const n=pending(),rej=Object.keys(S.rejected||{}).length;
  let cls='',txt='';
  if(!navigator.onLine){cls='off';txt='Offline'+(n?' — '+n+' waiting to upload':' — saving on this device');}
  else if(SYNC.busy){cls='on';txt='Syncing…';}
  else if(SYNC.err){cls='warn';txt='Sync problem — tap to retry'+(n?' ('+n+' waiting)':'');}
  else if(n){cls='warn';txt=n+' waiting to upload';}
  else{cls='on';txt='Synced';}
  if(rej)txt+=' · '+rej+' not accepted';
  return '<button type="button" class="net '+cls+'" data-act="net" title="Tap to sync now"><span class="dot"></span>'+esc(txt)+'</button>';

function chromeTop(){
  const t=document.getElementById('top');if(!t||!user)return;
  const q=K.T('sms').filter(m=>m.status==='queued').length;
  t.innerHTML='<h1>'+esc(titleOf(cur))+'</h1><div class="r">'+syncChip()+(q?'<span class="chip">SMS waiting <b>'+q+'</b></span>':'')+'</div>';
  t.onclick=e=>{if(e.target.closest('[data-act="net"]'))sync(true);};
}
function chromeAll(){chromeSide();chromeTop();}
function parseLink(){const m=String(location.hash||'').match(/^#m=([A-Za-z0-9._%-]+)/);try{return m?decodeURIComponent(m[1]):null;}catch(e){return null;}}
function handleLink(){
  if(!pendingLink||!user)return;
  const code=pendingLink;pendingLink=null;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  setTimeout(()=>{if(K.openCustomerLink)K.openCustomerLink(code);},300);
}
function go(id){
  if(!tabOk(id)){const f=firstTab();if(!f){doLogout('Your role has no access to any screen. Ask the branch manager.');return;}id=f;}
  cur=id;chromeAll();
  const el=document.getElementById('view');
  el.onclick=el.onchange=el.oninput=null;
  try{
    if(id==='dashboard')renderDashboard(el);else if(id==='sms')renderSms(el);else if(id==='settings')renderSettings(el);
    else C.views[id](el,K);
  }catch(e){console.error(e);el.innerHTML='<div class="card"><h3>Something went wrong</h3><p class="muted">'+esc(e&&e.message)+'</p></div>';}
  window.scrollTo(0,0);
}
function loginShell(right){
  document.getElementById('app').hidden=true;
  const l=document.getElementById('login');l.hidden=false;
  l.innerHTML='<div class="login-l"><div><div class="mono logo"><img src="'+LOGO_URI+'" alt="ADANFOPA logo"></div><h1>'+esc(S.settings.org)+'</h1><p class="tag">'+esc(C.tagline)+'</p></div><ul><li><i></i>Works on the branch computer and on phones</li><li><i></i>Keeps working offline — entries upload when you reconnect</li><li><i></i>Every login sees only what its role allows</li></ul></div><div class="login-r">'+right+'</div>';
}
function showLogin(){
  loginShell('<form class="login-card" id="lf"><h2>Sign in</h2><p class="sub">Use the username and password given to you by the branch manager.</p><label class="fld" style="margin-bottom:12px"><span>Username</span><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label class="fld"><span>Password</span><input type="password" id="lp" autocomplete="current-password"></label><button class="btn pri" type="submit" id="lb">Sign in</button><p class="demo">Forgot your password? Ask the branch manager to reset it in Settings.</p></form>');
  const lu=document.getElementById('lu');lu.focus();
  document.getElementById('lf').onsubmit=async e=>{
    e.preventDefault();
    const btn=document.getElementById('lb');
    if(!lu.value.trim()||!document.getElementById('lp').value){K.toast('Enter your username and password','bad');return;}
    if(!navigator.onLine){K.toast('You need an internet connection to sign in','bad');return;}
    btn.disabled=true;btn.textContent='Signing in…';
    try{const u=await doSignIn(lu.value,document.getElementById('lp').value);await afterLogin(u);}
    catch(x){K.toast(String(x.message||x),'bad');btn.disabled=false;btn.textContent='Sign in';}
  };
}
async function doSignIn(username,pw){
  const {data,error}=await sb.auth.signInWithPassword({email:username.trim().toLowerCase()+'@'+DOMAIN,password:pw});
  if(error)throw new Error(/invalid|credential/i.test(error.message)?'Wrong username or password.':error.message);
  const {data:p,error:pe}=await sb.from('adf_profiles').select('*').eq('id',data.user.id).maybeSingle();
  if(pe||!p){await sb.auth.signOut();throw new Error('This login is not set up for ADANFOPA Microfinance.');}
  if(!p.active){await sb.auth.signOut();throw new Error('Your access has been disabled. Ask the branch manager.');}
  return profileToUser(p);
}
function profileToUser(p){return{id:p.id,name:p.full_name,role:p.role,username:p.username,mustChange:!!p.must_change_password};}
function cacheProfile(){try{localStorage.setItem('adanfopa_profile',JSON.stringify(user));}catch(e){}}
function forcePasswordChange(u){
  return new Promise(resolve=>{
    loginShell('<form class="login-card" id="pf"><h2>Choose a new password</h2><p class="sub">Hello '+esc(u.name)+'. Your password was set by the branch manager — please choose your own before you continue.</p><label class="fld" style="margin-bottom:12px"><span>New password</span><input type="password" id="np1" autocomplete="new-password"><small>At least 8 characters.</small></label><label class="fld"><span>Repeat new password</span><input type="password" id="np2" autocomplete="new-password"></label><button class="btn pri" type="submit" id="pb">Save and continue</button></form>');
    document.getElementById('np1').focus();
    document.getElementById('pf').onsubmit=async e=>{
      e.preventDefault();
      const a=document.getElementById('np1').value,b=document.getElementById('np2').value;
      if(a.length<8){K.toast('Use at least 8 characters','bad');return;}
      if(a!==b){K.toast('The two passwords do not match','bad');return;}
      const btn=document.getElementById('pb');btn.disabled=true;
      const r=await sb.auth.updateUser({password:a});
      if(r.error){K.toast(r.error.message,'bad');btn.disabled=false;return;}
      await sb.rpc('adf_clear_must_change');
      u.mustChange=false;resolve();
    };
  });
}
async function afterLogin(u){
  if(S.owner&&S.owner!==u.id){
    if(pending()){
      try{await sb.auth.signOut();}catch(e){}
      throw new Error('This device still holds entries from another user that have not uploaded yet. Connect to the internet and ask that person to sign in once.');
    }
    S=freshState();
  }
  S.owner=u.id;user=u;persist();
  if(u.mustChange)await forcePasswordChange(u);
  cacheProfile();
  await enter();
}
async function enter(){
  if(!S.cursor&&navigator.onLine){
    loginShell('<div class="login-card"><h2>Loading your data…</h2><p class="sub">Please wait a moment.</p></div>');
    await sync();
  }
  document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;
  const f=firstTab();if(!f){await doLogout('Your role has no access to any screen. Ask the branch manager.');return;}
  cur=f;go(f);startTimers();handleLink();
  if(S.cursor)sync();
}
async function doLogout(msg){
  signingOut=true;
  try{if(navigator.onLine&&user&&pending())await flush();}catch(e){}
  try{await sb.auth.signOut();}catch(e){}
  user=null;try{localStorage.removeItem('adanfopa_profile');}catch(e){}
  persist();signingOut=false;showLogin();
  if(msg)K.toast(msg,'warn');
}
K.start=async cfg=>{
  C=cfg;
  const r=document.documentElement.style;
  r.setProperty('--ink',C.ink);r.setProperty('--accent',C.accent);r.setProperty('--accent-ink',C.accentInk||'#1a1405');
  r.setProperty('--accent-soft',hex2rgba(C.accent,.18));r.setProperty('--ink-soft',hex2rgba(C.ink,.1));
  document.title=C.name+' \u2014 '+C.product;
  const st=document.createElement('style');st.textContent=RCPT_CSS;document.head.appendChild(st);
  loadCache();
  pendingLink=parseLink();
  window.addEventListener('hashchange',()=>{const l=parseLink();if(l){pendingLink=l;if(user)handleLink();}});
  try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
  if(!window.supabase||!window.supabase.createClient){
    document.getElementById('login').hidden=false;
    document.getElementById('login').innerHTML='<div class="login-r" style="grid-column:1/-1"><div class="login-card"><h2>Connect once to get started</h2><p class="sub">This device needs the internet one time to download the system. Please connect and refresh the page.</p></div></div>';
    return;
  }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'adanfopa-auth',detectSessionInUrl:false}});
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&user&&!signingOut){user=null;showLogin();}});
  let u=null,cached=null;
  try{cached=JSON.parse(localStorage.getItem('adanfopa_profile'));}catch(e){}
  try{
    const g=await sb.auth.getSession();
    const ses=g&&g.data&&g.data.session;
    if(ses&&navigator.onLine){
      const {data:p,error}=await sb.from('adf_profiles').select('*').eq('id',ses.user.id).maybeSingle();
      if(p&&p.active)u=profileToUser(p);
      else if(error&&isNet(error)&&cached&&cached.id===ses.user.id)u=cached;
    }else if(ses&&cached&&cached.id===ses.user.id)u=cached;
  }catch(e){}
  if(!u&&!navigator.onLine&&cached&&S.owner===cached.id)u=cached;
  if(u){
    if(S.owner&&S.owner!==u.id&&!pending())S=freshState();
    S.owner=u.id;user=u;
    if(u.mustChange&&navigator.onLine)await forcePasswordChange(u);
    u.mustChange=false;cacheProfile();
    await enter();
  }else showLogin();
};

})();

 '.idc .row{display:flex;gap:4mm;font-size:2.7mm;line-height:1.5}.idc .row span{color:#6b7680}.idc .su{font-size:2.5mm;margin-top:1mm;color:#2b3035}'+

 '.idc .bt{font-size:2.6mm;line-height:1.45}.idc .bt h5{margin:0 0 1mm;font-size:3.2mm}.idc .bt p{margin:0 0 1.4mm}.idc .fine{font-size:2mm;color:#5b6670;line-height:1.35}'+

function cardUrl(m){return location.protocol==='file:'?null:location.origin+location.pathname+'#m='+encodeURIComponent(m.code);}

const outstandingOf=l=>sum(T('loanSchedule').filter(r=>r.loanId===l.id),r=>r2(r.amountDue-r.amountPaid));

const nextInstallment=l=>{const r=T('loanSchedule').filter(x=>x.loanId===l.id).sort((a,b)=>a.seq-b.seq).find(x=>x.amountPaid<x.amountDue);return r?r2(r.amountDue-r.amountPaid):0;};
const statusOf=l=>{if(l.status==='active'&&hasOverdue(l))return['Overdue','bad'];const M={pending:['Pending','warn'],active:['Active','ok'],completed:['Completed','mute'],rejected:['Rejected','bad']};return M[l.status]||[l.status,'mute'];};
const schedRows=(principal,rate,termMonths,start)=>{const total=r2(principal+principal*rate/100),per=r2(total/termMonths),rows=[];
 for(let i=1;i<=termMonths;i++){const amt=i===termMonths?r2(total-per*(termMonths-1)):per;rows.push({seq:i,dueDate:addDays(start,i*30),amountDue:amt,amountPaid:0,status:'pending'});}return rows;};

 const span=Math.max(1,diffDays(i.maturityDate,i.startDate)),elapsed=Math.max(0,diffDays(today(),i.startDate));return r2(i.principal+(mv-i.principal)*Math.min(1,elapsed/span));};

 id:'adanfopa',version:1,name:'ADANFOPA Microfinance',product:'Microfinance Manager',sender:'ADANFOPA',phone:'0598088617 / 0594312391',address:'Obuasi Asonkore, Opposite Total Filling Station · P. O. Box 35, Obuasi, Ashanti Region, Ghana',

     '<input class="code" id="sc" placeholder="Name or ADF-SU-0001" autocomplete="off" autocapitalize="off"><div id="sres" class="sres"></div>'+
     '<div class="manualrow"><button type="button" class="btn pri" data-act="manual">Manual collection</button><span class="muted small">Paper-book entries, missed days, advance or part payments.</span></div></div>'+
     '<div class="card"><div class="card-h"><span>Today’s collections</span><button class="btn sm" data-act="newsusu">+ New account</button></div><div id="slist"></div></div></div>'+
     '<div class="card" style="margin-top:16px"><h3>Susu accounts</h3><div id="stab"></div></div>'+
     '<div class="card" style="margin-top:16px"><h3>Manual collections <span class="muted small" style="font-weight:400">last 15 entries</span></h3><div id="mtab"></div></div>';
    el.querySelector('#slist').innerHTML=K.list(T('susuTx').filter(x=>x.date===today()&&x.type==='collect'&&inScope(get('susuAccounts',x.accountId))).slice().reverse().map(x=>{const a=get('susuAccounts',x.accountId);return{t:mOf(a.memberId).name,s:'Collected by '+x.collector+(x.method==='manual'?' · Manual':''),r:money(x.amount)};}),'No collections recorded yet today.');
    el.querySelector('#stab').innerHTML=K.table([
     {l:'Customer',f:a=>'<b>'+esc(mOf(a.memberId).name)+'</b><span class="sub2">'+esc(a.code)+'</span>'},
     {l:'Daily amount',cls:'num',f:a=>money(a.dailyAmount)},
     {l:'Cycle',f:a=>{const c=a.cycleCount||0;return K.prog(Math.min(100,c/30*100),c>=30?'':'acc')+'<span class="sub2">'+c+' of 30 days</span>';}},
     {l:'Balance',cls:'num',f:a=>'<b>'+money(a.balance)+'</b>'},
     {l:'',cls:'acts',f:a=>(a.cycleCount||0)>=30&&K.can('susu.payout')?'<button class="btn sm acc" data-act="payout" data-id="'+a.id+'">Pay out</button>':((a.cycleCount||0)>=30?'<span class="sub2">Ready for payout</span>':'')}
    ],accounts(),{empty:'No susu accounts on your route yet'});
    const man=T('susuTx').filter(x=>x.method==='manual'&&inScope(get('susuAccounts',x.accountId))).map((x,i)=>({x:x,i:i}))
      .sort((p,q)=>p.x.date===q.x.date?q.i-p.i:(p.x.date<q.x.date?1:-1)).map(p=>p.x).slice(0,15);
    el.querySelector('#mtab').innerHTML=K.table([
     {l:'Date',f:x=>esc(fmtDate(x.date))},
     {l:'Customer',f:x=>{const a=get('susuAccounts',x.accountId);return '<b>'+esc(mOf(a.memberId).name)+'</b><span class="sub2">'+esc(a.code)+'</span>';}},
     {l:'Amount',cls:'num',f:x=>'<b>'+money(x.amount)+'</b><span class="sub2">'+(x.days||0)+' day(s)</span>'},
     {l:'Reason',f:x=>esc(x.reason||'')+(x.ref?'<span class="sub2">Ref '+esc(x.ref)+'</span>':'')},
     {l:'Recorded by',f:x=>esc(x.collector||'')},
     {l:'',cls:'acts',f:x=>{const a=get('susuAccounts',x.accountId);return K.can('susu.void')&&lastTx(a)===x?'<button class="btn sm bad" data-act="void" data-id="'+esc(x.id)+'">Void</button>':'';}}
    ],man,{empty:'No manual collections yet'});
    const sc=el.querySelector('#sc'),sres=el.querySelector('#sres');
    const find=q=>{q=q.trim().toLowerCase();if(!q)return[];return accounts().filter(a=>a.code.toLowerCase().indexOf(q)>=0||mOf(a.memberId).name.toLowerCase().split(/\s+/).some(w=>w.indexOf(q)===0)||mOf(a.memberId).name.toLowerCase().indexOf(q)>=0).slice(0,6);};
    const show=()=>{
      const q=sc.value;if(!q.trim()){sres.innerHTML='';return;}
      const list=find(q);
      sres.innerHTML=list.length?list.map(a=>{const done=T('susuTx').some(x=>x.accountId===a.id&&x.date===today()&&x.type==='collect');const full=(a.cycleCount||0)>=30;
        return '<button type="button" data-act="pick" data-id="'+esc(a.code)+'"><span><b>'+esc(mOf(a.memberId).name)+'</b><small>'+esc(a.code)+' · '+money(a.dailyAmount)+' a day</small></span><span>'+(full?K.badge('Ready for payout','warn'):done?K.badge('Collected today','ok'):'')+'</span></button>';}).join(''):'<div class="none">No customer found'+(K.ownOnly()?' on your route':'')+'.</div>';
    };
    sc.oninput=show;
    sc.onkeydown=e=>{if(e.key!=='Enter')return;const q=sc.value.trim();if(!q)return;
      const exact=accounts().find(a=>a.code.toLowerCase()===q.toLowerCase());
      if(exact){collect(exact.code);return;}
      const list=find(q);if(list.length===1)choose(list[0].code);else if(!list.length)collect(q);};
   };
   function collect(code){
    const q=String(code).trim().toLowerCase();
    const a=accounts().find(x=>x.code.toLowerCase()===q);
    if(!a){const other=T('susuAccounts').find(x=>x.code.toLowerCase()===q);
     K.result({tone:'bad',title:other?'NOT ON YOUR ROUTE':'SUSU NUMBER NOT FOUND',name:String(code),sub:other?'Assigned to another collector':'Not registered',rows:[]});return;}
    if((a.cycleCount||0)>=30){K.toast('Cycle complete — this customer is ready for payout','warn');return;}
    if(T('susuTx').some(x=>x.accountId===a.id&&x.date===today()&&x.type==='collect')){K.toast('Already collected from this customer today','warn');return;}
    add('susuTx',{accountId:a.id,date:today(),amount:a.dailyAmount,type:'collect',method:'quick',collector:me().name,collectorId:me().id});
    a.balance=r2(a.balance+a.dailyAmount);a.cycleCount=(a.cycleCount||0)+1;K.save();
    K.log('Susu collected '+money(a.dailyAmount)+' — '+mOf(a.memberId).name);
    K.result({tone:'ok',title:'COLLECTED',name:mOf(a.memberId).name,sub:a.code,rows:[['Amount',money(a.dailyAmount)],['New balance',money(a.balance)],['Cycle day',a.cycleCount+' of 30']]});
    draw();const c=el.querySelector('#sc');if(c){c.value='';c.focus();}
   }
   K.susuFocus=m=>{
    const list=accounts().filter(a=>a.memberId===m.id);
    if(!list.length){K.toast(m.name+' has no susu account on your route','warn');return;}
    const sc=el.querySelector('#sc');if(!sc)return;
    sc.value=m.name;if(sc.oninput)sc.oninput();
    if(list.length===1)choose(list[0].code);
   };
   function choose(code){
    const a=accounts().find(x=>x.code===code);if(!a)return;
    if((a.cycleCount||0)>=30){K.toast('Cycle complete — this customer is ready for payout','warn');return;}
    if(T('susuTx').some(x=>x.accountId===a.id&&x.date===today()&&x.type==='collect')){K.toast('Already collected from '+mOf(a.memberId).name+' today','warn');return;}
    K.confirm('Collect '+money(a.dailyAmount)+' from '+mOf(a.memberId).name+' ('+a.code+')?','Collect',()=>collect(a.code),'acc');
   }
   function manual(){
    const maxBack=K.can('susu.void')?60:7;
    K.formModal({title:'Manual collection',saveLabel:'Record collection',
     fields:[
      {k:'accountId',l:'Customer',t:'pick',opts:()=>accounts().map(a=>({v:a.id,l:mOf(a.memberId).name+' ('+a.code+')'})),req:1,w:'full'},
      {k:'date',l:'Collection date',t:'date',def:today(),req:1,hint:'Today, or back-date up to '+maxBack+' days.'},
      {k:'amount',l:'Amount received (GH₵)',t:'number',step:'0.01',min:0,req:1,hint:'More than the daily amount covers several days; less is kept as a part-payment.'},
      {k:'reason',l:'Reason for manual entry',t:'select',opts:REASONS,req:1,w:'full'},
      {k:'ref',l:'Paper book / receipt no. (optional)',w:'full'},
      {k:'note',l:'Note (optional)',t:'textarea'}
     ],
     onSave:v=>{
      const a=get('susuAccounts',v.accountId);
      if(!a||!inScope(a)){K.toast('Choose the customer from the list','bad');return false;}
      const d=v.date;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){K.toast('Enter a valid date','bad');return false;}
      if(d>today()){K.toast('The date cannot be in the future','bad');return false;}
      if(diffDays(today(),d)>maxBack){K.toast('You can only back-date up to '+maxBack+' days','bad');return false;}
      if(d<a.startDate){K.toast('That date is before this account was opened','bad');return false;}
      const amt=r2(Number(v.amount));
      if(!(amt>0)){K.toast('Enter an amount above zero','bad');return false;}
      const cyc=a.cycleCount||0,carryB=a.carry||0,daily=a.dailyAmount;
      if(cyc>=30){K.toast('This customer has completed 30 days — pay out first','warn');return false;}
      const total=r2(carryB+amt),days=Math.floor(total/daily+1e-9);
      if(cyc+days>30){const left=30-cyc;K.toast('Only '+left+' day(s) left in this cycle — enter at most '+money(r2(left*daily-carryB)),'bad');return false;}
      add('susuTx',{accountId:a.id,date:d,amount:amt,type:'collect',method:'manual',days:days,carryBefore:carryB,collector:me().name,collectorId:me().id,reason:v.reason,ref:v.ref||'',note:v.note||''});
      a.balance=r2(a.balance+amt);a.cycleCount=cyc+days;a.carry=r2(total-days*daily);K.save();
      K.log('Manual susu collection '+money(amt)+' — '+mOf(a.memberId).name+' ('+fmtDate(d)+', by '+me().name+')');
      draw();
      const meta=[['Account',a.code],['Customer',mOf(a.memberId).name],['Date',fmtDate(d)],['Collected by',me().name]];if(v.ref)meta.push(['Book ref',v.ref]);
      K.showReceipt({title:'Susu collection receipt',meta:meta,totals:[['Amount',money(amt),1],['Days covered',String(days)+' (cycle '+a.cycleCount+' of 30)'],['New balance',money(a.balance)]],foot:'Thank you for saving with us'});
     }});
   }
   function voidTx(id){
    if(!K.can('susu.void'))return;
    const x=get('susuTx',id);if(!x)return;const a=get('susuAccounts',x.accountId);
    if(lastTx(a)!==x){K.toast('Only the latest entry on an account can be voided','warn');return;}
    K.confirm('Void the manual collection of '+money(x.amount)+' for '+mOf(a.memberId).name+' ('+fmtDate(x.date)+')? The balance and cycle days will be reversed.','Void entry',()=>{
     K.del('susuTx',x.id);a.balance=r2(a.balance-x.amount);a.cycleCount=Math.max(0,(a.cycleCount||0)-(x.days||0));a.carry=x.carryBefore||0;K.save();
     K.log('VOIDED manual susu collection '+money(x.amount)+' — '+mOf(a.memberId).name+' (by '+me().name+')');draw();K.toast('Entry voided','ok');
    },'bad');
   }
   function payout(id){
    if(!K.can('susu.payout')){K.toast('Only the branch manager can pay out','warn');return;}
    const a=get('susuAccounts',id);const commission=a.dailyAmount,amt=Math.max(0,r2(a.balance-commission));
    K.confirm('Pay out '+money(amt)+' to '+mOf(a.memberId).name+'? A commission of '+money(commission)+' (1 day) is kept, and the cycle restarts.','Pay out',()=>{
     add('susuTx',{accountId:a.id,date:today(),amount:-amt,type:'payout',collector:me().name,collectorId:me().id});
     a.balance=0;a.cycleCount=0;a.carry=0;K.save();
     if(mOf(a.memberId).phone)K.sms(mOf(a.memberId).phone,K.S.settings.org+': Your susu payout of '+money(amt)+' is ready for collection. Thank you for saving with us.','Susu',mOf(a.memberId).name);
     K.log('Susu payout '+money(amt)+' — '+mOf(a.memberId).name);draw();K.toast('Payout recorded','ok');
    },'acc');
   }
   K.bind(el,{pick:code=>choose(code),payout:id=>payout(id),manual:()=>manual(),void:id=>voidTx(id),
    newsusu:()=>{
     const fields=[{k:'memberId',l:'Customer',t:'pick',opts:mOpts,req:1,w:'full'},{k:'dailyAmount',l:'Daily contribution (GH₵)',t:'number',step:'0.01',req:1,def:10}];
     if(K.can('susu.assign'))fields.push({k:'agentId',l:'Assigned collector',t:'select',opts:K.staff().filter(u=>u.role==='Susu collector'&&u.active).map(u=>({v:u.id,l:u.full_name})),blank:false,w:'full'});
     K.formModal({title:'New susu account',fields:fields,
      onSave:v=>{const row=add('susuAccounts',{memberId:v.memberId,dailyAmount:v.dailyAmount,agentId:v.agentId||me().id,agent:((K.staff().find(u=>u.id===(v.agentId||me().id))||{}).full_name)||me().name,startDate:today(),balance:0,cycleCount:0,carry:0,status:'active'});
       row.code=K.code('ADF-SU-','susuAccounts');K.save();K.log('New susu account — '+mOf(v.memberId).name);draw();K.toast('Susu account opened','ok');}});
    }});
   draw();
  },
